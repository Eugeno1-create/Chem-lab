<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLab Rural – Practical Scenario Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="game-container" id="gameContainer">
    <!-- Header -->
    <div class="header">
        <h1><span>🧪</span> ChemLab Rural</h1>
        <div class="stats">
            <div>Q <span id="qCounter">1 / 300</span></div>
            <div>Score <span id="scoreDisplay">0</span></div>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Main game area -->
    <div class="main" id="gameMain">
        <div class="category-badge" id="categoryBadge">Volumetric Analysis</div>
        <div class="question-text" id="questionText">Loading…</div>

        <div class="options" id="optionsContainer"></div>

        <div class="correction-panel" id="correctionPanel">
            <div class="verdict" id="verdictText"></div>
            <div class="explanation" id="explanationText"></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit Answer</button>
            <button class="btn btn-secondary" id="nextBtn" disabled>Next →</button>
        </div>
    </div>

    <!-- Results screen -->
    <div class="main results" id="resultsScreen">
        <div class="big-score" id="finalScore">0<small>/300</small></div>
        <div class="message" id="finalMessage"></div>
        <div class="breakdown">
            <div>
                <div class="num green" id="correctCount">0</div>
                <div class="label">Correct</div>
            </div>
            <div>
                <div class="num red" id="wrongCount">0</div>
                <div class="label">Incorrect</div>
            </div>
            <div>
                <div class="num" id="percentScore">0%</div>
                <div class="label">Accuracy</div>
            </div>
        </div>
        <br>
        <button class="btn btn-primary" id="restartBtn" style="max-width:280px; margin:0 auto;">Play Again</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
